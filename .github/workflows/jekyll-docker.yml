name: OMEGA-Q Quantum-Resistant CI
jobs:
build_and_audit:
steps:
- name: OMEGA-Q Guardian Audit
# Validación ISO 27001 de integridad de archivos
- name: Build Site (Jekyll)
# Construcción en contenedor aislado
- name: NOM-151 Quantum Sealing
# Generación de Constancia de Conservación PQC
name: Jekyll site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the site in the jekyll/builder container
      run: |
        docker run \
        -v ${{ github.workspace }}:/srv/jekyll -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
        jekyll/builder:latest /bin/bash -c "chmod -R 777 /srv/jekyll && jekyll build --future"
